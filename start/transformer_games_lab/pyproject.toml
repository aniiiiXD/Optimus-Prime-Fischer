[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cpu-gamebench"
version = "0.1.0"
description = "CPU-first game adapters, search, tournaments, training, and Transformer profiling"
requires-python = ">=3.11"
dependencies = [
  "psutil>=5.9",
  "torch>=2.3,<3",
]

[tool.setuptools.packages.find]
include = ["gamebench*"]

[tool.ruff]
line-length = 110
target-version = "py311"
